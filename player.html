<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IPTV Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/video.js@latest/dist/video.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/video.js@latest/dist/video-js.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        
        #player-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        #video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        
        #channel-info {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            z-index: 10;
            transition: opacity 0.3s;
        }
        
        #channel-info.hidden {
            opacity: 0;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
            z-index: 5;
        }
        
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(220, 38, 38, 0.95);
            color: white;
            padding: 20px 30px;
            border-radius: 12px;
            text-align: center;
            max-width: 80%;
            z-index: 20;
            display: none;
        }
        
        #error.show {
            display: block;
        }
        
        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }
        
        .btn {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }
        
        .btn:active {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div id="player-container">
        <div id="channel-info">
            <span id="channel-name">📺 Kanal yükleniyor...</span>
        </div>
        
        <div id="loading">
            <div class="spinner"></div>
            <div>Yükleniyor...</div>
        </div>
        
        <div id="error">
            <h3>❌ Hata</h3>
            <p id="error-message">Yayın başlatılamadı</p>
        </div>
        
        <video id="video" playsinline controls autoplay></video>
        
        <div class="controls">
            <button class="btn" onclick="togglePlay()">⏯️ Oynat/Duraklat</button>
            <button class="btn" onclick="toggleFullscreen()">⛶ Tam Ekran</button>
        </div>
    </div>

    <script>
        // Get stream URL from query parameter
        const urlParams = new URLSearchParams(window.location.search);
        const streamUrl = urlParams.get('url');
        const channelName = urlParams.get('name') || 'IPTV Kanalı';
        
        const video = document.getElementById('video');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const errorMessage = document.getElementById('error-message');
        const channelInfo = document.getElementById('channel-info');
        const channelNameEl = document.getElementById('channel-name');
        
        // Set channel name
        channelNameEl.textContent = `📺 ${decodeURIComponent(channelName)}`;
        
        // Hide channel info after 5 seconds
        setTimeout(() => {
            channelInfo.classList.add('hidden');
        }, 5000);
        
        // Show channel info on tap
        video.addEventListener('click', () => {
            channelInfo.classList.remove('hidden');
            setTimeout(() => {
                channelInfo.classList.add('hidden');
            }, 3000);
        });
        
        if (!streamUrl) {
            showError('Stream URL bulunamadı');
        } else {
            loadStream(streamUrl);
        }
        
        function loadStream(url) {
            if (Hls.isSupported()) {
                const hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true,
                    backBufferLength: 90
                });
                
                hls.loadSource(url);
                hls.attachMedia(video);
                
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    hideLoading();
                    video.play().catch(err => {
                        console.error('Autoplay error:', err);
                    });
                });
                
                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        switch(data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                showError('Ağ hatası: Stream yüklenemedi');
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                showError('Medya hatası');
                                hls.recoverMediaError();
                                break;
                            default:
                                showError('Yayın başlatılamadı');
                                hls.destroy();
                                break;
                        }
                    }
                });
            } 
            // HLS.js is not supported on platforms that support HLS natively (Safari, iOS)
            else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    hideLoading();
                    video.play().catch(err => {
                        console.error('Autoplay error:', err);
                    });
                });
                
                video.addEventListener('error', function() {
                    showError('Yayın yüklenemedi');
                });
            } else {
                showError('Tarayıcınız HLS desteklemiyor');
            }
        }
        
        function hideLoading() {
            loading.style.display = 'none';
        }
        
        function showError(msg) {
            loading.style.display = 'none';
            errorMessage.textContent = msg;
            error.classList.add('show');
        }
        
        function togglePlay() {
            if (video.paused) {
                video.play();
            } else {
                video.pause();
            }
        }
        
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                video.requestFullscreen().catch(err => {
                    console.error('Fullscreen error:', err);
                });
            } else {
                document.exitFullscreen();
            }
        }
        
        // Telegram Web App integration
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }
    </script>
</body>
</html>
